CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584
CONFIG_BT_RX_STACK_SIZE=3072

# Align the TX power encoded in the Fast Pair advertising set and
# the Read Beacon Parameters response with Fast Pair expectations.
CONFIG_BT_ADV_PROV_TX_POWER_CORRECTION_VAL=-11
CONFIG_BT_FAST_PAIR_FMDN_TX_POWER_CORRECTION_VAL=-11

# Use the CRACEN HW peripheral only for random number generation (RNG) to save memory.
# Other crypto primitives are handled by the SW crypto library (Oberon),
# which is less secure option than the HW crypto (CRACEN).
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_CRYPTO_DRIVER_CRACEN=y
CONFIG_PSA_USE_CRACEN_CIPHER_DRIVER=n
CONFIG_PSA_USE_CRACEN_AEAD_DRIVER=n
CONFIG_PSA_USE_CRACEN_HASH_DRIVER=n
CONFIG_PSA_USE_CRACEN_MAC_DRIVER=n
CONFIG_PSA_USE_CRACEN_PAKE_DRIVER=n
CONFIG_PSA_USE_CRACEN_ASYMMETRIC_DRIVER=n
CONFIG_PSA_USE_CRACEN_ASYMMETRIC_SIGNATURE_DRIVER=n
CONFIG_PSA_USE_CRACEN_KEY_AGREEMENT_DRIVER=n
CONFIG_PSA_USE_CRACEN_KEY_DERIVATION_DRIVER=n
CONFIG_PSA_USE_CRACEN_KEY_MANAGEMENT_DRIVER=n
CONFIG_CRACEN_LIB_KMU=n

# Channel sounding, copied from the channel_sounding_ras_reflector sample

# The Ranging Profile recommends a MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# # This reduces RAM usage. Additional RAM is needed to support optional
# # features such as mode 3 or multiantenna. Change or remove these if
# # using those features
# CONFIG_BT_RAS_MODE_3_SUPPORTED=n
# CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
# CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
# CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
# CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
#
# # This size assumes the largest step size is mode 2 with one antenna path:
# # 12 bytes * 160 steps in a subevent. Change or remove this if using mode 3
# # or multiantenna.
# CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_SIZE=1920

# This allows CS and ACL to use different PHYs
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
